<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>末日避难所：我的生存日志</title>
  <style>
    :root{--bg:#101511;--panel:#162118;--panel2:#1e2d21;--text:#baffba;--muted:#79b779;--accent:#48ff62;--danger:#ff6b6b;--border:#345c38;--shadow:rgba(0,0,0,.35);--font:"Courier New",monospace}
    [data-theme="warm"]{--bg:#392616;--panel:#5a3b22;--panel2:#704d30;--text:#ffe2bd;--muted:#d6ab74;--accent:#ffb35b;--danger:#ff7777;--border:#95683f;--shadow:rgba(50,20,0,.35);--font:Georgia,"Noto Serif SC",serif}
    [data-theme="north"]{--bg:#e9f5ff;--panel:#f7fcff;--panel2:#d8efff;--text:#18354a;--muted:#55758d;--accent:#208bd6;--danger:#b83242;--border:#9cc9e8;--shadow:rgba(58,116,154,.2);--font:"Trebuchet MS","Microsoft YaHei",sans-serif}
    [data-theme="lab"]{--bg:#071420;--panel:#0d2234;--panel2:#112f48;--text:#d8fbff;--muted:#7fcbd9;--accent:#34d7ff;--danger:#ff4d9a;--border:#1c6b86;--shadow:rgba(0,200,255,.15);--font:"Segoe UI","Microsoft YaHei",sans-serif}
    [data-theme="diary"]{--bg:#eadfca;--panel:#fff6df;--panel2:#f4e5bd;--text:#42301c;--muted:#85643e;--accent:#9c5b24;--danger:#a23a2e;--border:#c9a86d;--shadow:rgba(91,57,20,.2);--font:"Comic Sans MS","Kaiti SC",cursive}
    *{box-sizing:border-box} body{margin:0;background:radial-gradient(circle at top,var(--panel2),var(--bg));color:var(--text);font-family:var(--font);line-height:1.45;min-height:100vh} button,input,select,textarea{font:inherit} .wrap{max-width:1180px;margin:0 auto;padding:14px 14px 96px}.top{position:sticky;top:0;z-index:3;backdrop-filter:blur(10px);background:color-mix(in srgb,var(--bg) 82%,transparent);border-bottom:1px solid var(--border)}.top-inner{max-width:1180px;margin:0 auto;padding:10px 14px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}h1{font-size:clamp(20px,5vw,34px);margin:8px 0}.badge{border:1px solid var(--border);background:var(--panel);padding:6px 10px;border-radius:999px;color:var(--accent)}.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:12px}.card{grid-column:span 12;background:linear-gradient(180deg,var(--panel),color-mix(in srgb,var(--panel) 88%,#000));border:1px solid var(--border);border-radius:14px;padding:14px;box-shadow:0 10px 26px var(--shadow)}@media(min-width:760px){.span4{grid-column:span 4}.span6{grid-column:span 6}.span8{grid-column:span 8}}h2{font-size:18px;margin:0 0 10px;color:var(--accent)}.stats,.resources{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}.stat,.res{background:var(--panel2);border:1px dashed var(--border);border-radius:10px;padding:10px}.label{color:var(--muted);font-size:13px}.value{font-size:22px;font-weight:700}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.col{display:flex;flex-direction:column;gap:8px}button,.btn{border:1px solid var(--border);background:var(--panel2);color:var(--text);padding:8px 11px;border-radius:10px;cursor:pointer}button:hover{outline:2px solid var(--accent)}button.primary{background:var(--accent);color:var(--bg);font-weight:700}.danger{border-color:var(--danger);color:var(--danger)}input,select,textarea{width:100%;background:color-mix(in srgb,var(--panel2) 85%,#000);border:1px solid var(--border);color:var(--text);border-radius:10px;padding:9px}small{color:var(--muted)}.list{display:grid;gap:8px}.item{background:color-mix(in srgb,var(--panel2) 75%,transparent);border:1px solid var(--border);border-radius:10px;padding:10px}.log{max-height:360px;overflow:auto}.footer-input{position:fixed;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--bg) 92%,transparent);border-top:1px solid var(--border);padding:10px}.footer-input .inner{max-width:1180px;margin:0 auto;display:grid;grid-template-columns:1fr 130px 90px;gap:8px}@media(max-width:640px){.footer-input .inner{grid-template-columns:1fr}.wrap{padding-bottom:170px}}.pill{display:inline-block;margin:2px;padding:3px 7px;border:1px solid var(--border);border-radius:999px;color:var(--muted)}.done{text-decoration:line-through;color:var(--muted)}
  </style>
</head>
<body data-theme="terminal">
<header class="top"><div class="top-inner"><div><h1>末日避难所：我的生存日志</h1><div class="row"><span class="badge" id="dateBadge"></span><span class="badge" id="dayBadge"></span><span class="badge" id="statusBadge"></span></div></div><div class="row"><select id="themeSelect" title="皮肤"><option value="terminal">废土终端</option><option value="warm">温暖避难所</option><option value="north">北方基地</option><option value="lab">科技研究所</option><option value="diary">复古日记</option></select><button id="nextDayBtn" class="primary">结束今天</button></div></div></header>
<main class="wrap"><section class="grid">
  <div class="card span8"><h2>基础资源</h2><div id="resources" class="resources"></div></div>
  <div class="card span4"><h2>基地信息</h2><div id="baseStats" class="stats"></div></div>
  <div class="card span6"><h2>现实任务系统</h2><div class="col"><textarea id="taskText" rows="3" placeholder="今天完成：学习30分钟 / 工作2小时 / 运动40分钟"></textarea><div class="row"><select id="taskType"><option value="study">学习</option><option value="work">工作</option><option value="exercise">运动</option><option value="life">生活</option></select><button id="addTask" class="primary">记录任务并领奖励</button></div><small>奖励规则可在下方编辑，保存后即时生效。</small><div id="tasks" class="list"></div></div></div>
  <div class="card span6"><h2>奖励规则</h2><div id="rules" class="list"></div><button id="saveRules">保存奖励规则</button></div>
  <div class="card span6"><h2>合成系统</h2><div id="crafting" class="list"></div></div>
  <div class="card span6"><h2>建筑系统</h2><div id="buildings" class="list"></div></div>
  <div class="card span6"><h2>科技与成就</h2><div id="techAchievements" class="list"></div></div>
  <div class="card span6"><h2>随机事件</h2><div id="events" class="list"></div></div>
  <div class="card span8"><h2>游戏日志</h2><div id="logs" class="list log"></div></div>
  <div class="card span4"><h2>数据管理</h2><div class="col"><button id="exportBtn">导出数据 .json</button><input id="importFile" type="file" accept="application/json"><button id="resetBtn" class="danger">重置世界</button><small>所有进度存储在本机 IndexedDB。</small></div></div>
</section></main>
<div class="footer-input"><div class="inner"><input id="quickTask" placeholder="快速记录：如 工作2小时"><select id="quickType"><option value="work">工作</option><option value="study">学习</option><option value="exercise">运动</option><option value="life">生活</option></select><button id="quickAdd" class="primary">完成</button></div></div>
<script>
(() => { 'use strict';
const DB='ShelterSurvivalLogDB', STORE='state', KEY='game';
const resNames={food:'食物',water:'水',wood:'木材',stone:'石头',metal:'金属',plastic:'塑料',energy:'能源',knowledge:'知识点',research:'科研资料',health:'健康值',plank:'木板',slab:'石板',parts:'金属零件',chemical:'化学材料',advanced:'高级材料',glass:'玻璃',electronics:'电子元件',vegetable:'蔬菜',rare:'稀有材料'};
const recipes=[{name:'加工木板',in:{wood:5},out:{plank:2}},{name:'加工石板',in:{stone:5},out:{slab:2}},{name:'制造金属零件',in:{metal:3,energy:1},out:{parts:1}},{name:'制造高级材料',in:{plastic:3,chemical:1},out:{advanced:1}},{name:'熔炼玻璃',in:{stone:2,energy:1},out:{glass:1}},{name:'拆解电子元件',in:{metal:2,plastic:2,energy:1},out:{electronics:1}}];
const buildings=[{id:'shelter',name:'小型避难所',desc:'等级1：每天减少水消耗。',cost:{plank:50,slab:30},effect:'稳定度提高，水消耗 -1'},{id:'greenhouse',name:'温室',desc:'自动生产蔬菜。需要玻璃、能源、水。',cost:{glass:10,energy:8,water:20},effect:'每天蔬菜 +5'},{id:'workbench',name:'工作台',desc:'解锁高级合成。',cost:{plank:20,parts:8},effect:'科技等级 +1，高级配方可用'},{id:'generator',name:'发电设备',desc:'由金属零件和电子元件组装。',cost:{parts:15,electronics:5},effect:'每天能源 +3'}];
const initial=()=>({version:1,date:new Date().toISOString().slice(0,10),day:1,status:'警戒但稳定',resources:{food:100,water:100,wood:50,stone:30,metal:20,plastic:10,energy:5,knowledge:0,research:0,health:50,plank:0,slab:0,parts:0,chemical:3,advanced:0,glass:0,electronics:0,vegetable:0,rare:0},buildings:{},tech:{level:0,unlocked:['基础加工']},tasks:[],achievements:['第1天：建立避难所。'],logs:['第1天。你在废墟边缘整理出一处临时避难所。'],settings:{theme:'terminal',rules:{study:{knowledge:5,research:2},work:{metal:4,plastic:2,energy:1},exercise:{food:2,health:4},life:{water:2,wood:2,stone:1}}},events:[]});
let state;
function openDB(){return new Promise((ok,fail)=>{const r=indexedDB.open(DB,1);r.onupgradeneeded=()=>r.result.createObjectStore(STORE);r.onsuccess=()=>ok(r.result);r.onerror=()=>fail(r.error);});}
async function save(){const db=await openDB();return new Promise((ok,fail)=>{const tx=db.transaction(STORE,'readwrite');tx.objectStore(STORE).put(state,KEY);tx.oncomplete=ok;tx.onerror=()=>fail(tx.error);});}
async function load(){const db=await openDB();return new Promise((ok)=>{const tx=db.transaction(STORE,'readonly');const rq=tx.objectStore(STORE).get(KEY);rq.onsuccess=()=>ok(rq.result||initial());rq.onerror=()=>ok(initial());});}
const fmt=o=>Object.entries(o).map(([k,v])=>`${resNames[k]||k}×${v}`).join('，');
const canPay=c=>Object.entries(c).every(([k,v])=>(state.resources[k]||0)>=v);
function pay(c){Object.entries(c).forEach(([k,v])=>state.resources[k]-=v)} function gain(o){Object.entries(o).forEach(([k,v])=>state.resources[k]=(state.resources[k]||0)+Number(v))}
function render(){document.body.dataset.theme=state.settings.theme; themeSelect.value=state.settings.theme; dateBadge.textContent=`日期 ${state.date}`; dayBadge.textContent=`生存第 ${state.day} 天`; statusBadge.textContent=state.status;
resources.innerHTML=Object.entries(state.resources).map(([k,v])=>`<div class="res"><div class="label">${resNames[k]||k}</div><div class="value">${v}</div></div>`).join('');
baseStats.innerHTML=`<div class="stat"><div class="label">避难所等级</div><div class="value">${1+(state.buildings.shelter||0)}</div></div><div class="stat"><div class="label">建筑数量</div><div class="value">${Object.values(state.buildings).reduce((a,b)=>a+b,0)}</div></div><div class="stat"><div class="label">科技等级</div><div class="value">${state.tech.level}</div></div>`;
tasks.innerHTML=state.tasks.slice(-8).reverse().map(t=>`<div class="item"><b>${t.text}</b><br><small>${t.date}｜奖励：${fmt(t.reward)}</small></div>`).join('')||'<small>尚未记录任务。</small>';
rules.innerHTML=Object.entries(state.settings.rules).map(([type,rule])=>`<div class="item"><b>${{study:'学习',work:'工作',exercise:'运动',life:'生活'}[type]}</b><textarea data-rule="${type}" rows="2">${Object.entries(rule).map(([k,v])=>`${k}:${v}`).join(', ')}</textarea><small>格式：resource:number，用英文逗号分隔。</small></div>`).join('');
crafting.innerHTML=recipes.map((r,i)=>`<div class="item"><b>${r.name}</b><br><span class="pill">消耗 ${fmt(r.in)}</span><span class="pill">获得 ${fmt(r.out)}</span><br><button data-craft="${i}" ${canPay(r.in)?'':'disabled'}>合成</button></div>`).join('');
buildings.innerHTML=buildings.map(b=>`<div class="item"><b>${b.name} Lv.${state.buildings[b.id]||0}</b><p>${b.desc}</p><small>效果：${b.effect}</small><br><span class="pill">升级需求 ${fmt(b.cost)}</span><br><button data-build="${b.id}" ${canPay(b.cost)?'':'disabled'}>建设/升级</button></div>`).join('');
techAchievements.innerHTML=`<div class="item"><b>已解锁科技</b><br>${state.tech.unlocked.map(x=>`<span class="pill">${x}</span>`).join('')}</div><div class="item"><b>成就</b><br>${state.achievements.map(x=>`<span class="pill">${x}</span>`).join('')}</div>`;
events.innerHTML=state.events.slice(-5).reverse().map(e=>`<div class="item"><b>${e.title}</b><p>${e.text}</p></div>`).join('')||'<small>今天没有异常信号。</small>';
logs.innerHTML=state.logs.slice(-60).reverse().map(l=>`<div class="item">${l}</div>`).join('');}
async function addTask(text,type){if(!text.trim())return; const reward={...state.settings.rules[type]}; gain(reward); state.tasks.push({date:state.date,text:text.trim(),type,reward}); state.logs.push(`第${state.day}天。你完成了现实任务「${text.trim()}」，获得：${fmt(reward)}。`); await save(); render();}
function parseRule(s){const out={}; s.split(',').map(x=>x.trim()).filter(Boolean).forEach(p=>{const [k,v]=p.split(':').map(x=>x.trim()); if(k&&Number(v)) out[k]=Number(v)}); return out;}
function checkAchievements(){const add=a=>{if(!state.achievements.includes(a))state.achievements.push(a)}; if(state.day>=7)add('第7天：第一次种植成功。'); if((state.buildings.generator||0)>0)add('第30天：实现能源自给。'); if(state.day>=100)add('第100天：建立稳定基地。');}
function randomEvent(){if(Math.random()<.45){const e=Math.random()<.5?{title:'废墟探索',text:'发现旧时代电脑。若拥有电子元件×5，将自动修复并获得科技资料×50。'}:{title:'紧急事件',text:'发现即将消失的资源点。今天额外完成现实任务可获得稀有材料。'}; state.events.push(e); state.logs.push(`第${state.day}天。随机事件：${e.title}。${e.text}`); if(e.title==='废墟探索'&&canPay({electronics:5})){pay({electronics:5});gain({research:50});state.logs.push('你修复了旧时代电脑，获得科技资料×50。')} if(e.title==='紧急事件'&&state.tasks.some(t=>t.date===state.date)){gain({rare:1});state.logs.push('你把握住了资源点，获得稀有材料×1。')}}}
async function nextDay(){state.day++; state.date=new Date(Date.now()+(state.day-1)*86400000).toISOString().slice(0,10); let daily={}; if(state.buildings.greenhouse) daily.vegetable=5*state.buildings.greenhouse; if(state.buildings.generator) daily.energy=3*state.buildings.generator; gain(daily); state.resources.water=Math.max(0,state.resources.water-(state.buildings.shelter?1:2)); state.resources.food=Math.max(0,state.resources.food-1); state.status=state.resources.water<10||state.resources.food<10?'资源告急':'警戒但稳定'; randomEvent(); checkAchievements(); state.logs.push(`第${state.day}天。今天天气晴朗。${Object.keys(daily).length?`自动生产：${fmt(daily)}。`:''}避难所稳定度保持。`); await save(); render();}
document.addEventListener('click',async e=>{const c=e.target.dataset.craft,b=e.target.dataset.build; if(c!==undefined){const r=recipes[c]; pay(r.in); gain(r.out); state.logs.push(`第${state.day}天。完成合成：${r.name}，获得${fmt(r.out)}。`); await save(); render()} if(b){const bd=buildings.find(x=>x.id===b); pay(bd.cost); state.buildings[b]=(state.buildings[b]||0)+1; if(b==='workbench'&&!state.tech.unlocked.includes('高级合成')){state.tech.level++;state.tech.unlocked.push('高级合成')} state.logs.push(`第${state.day}天。建设/升级了${bd.name}。${bd.effect}。`); await save(); render()}});
addTask.onclick=()=>addTask(taskText.value,taskType.value).then(()=>taskText.value=''); quickAdd.onclick=()=>addTask(quickTask.value,quickType.value).then(()=>quickTask.value=''); nextDayBtn.onclick=nextDay; themeSelect.onchange=async()=>{state.settings.theme=themeSelect.value; await save(); render()}; saveRules.onclick=async()=>{document.querySelectorAll('[data-rule]').forEach(t=>state.settings.rules[t.dataset.rule]=parseRule(t.value)); await save(); render()};
exportBtn.onclick=()=>{const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'})); a.download=`shelter-log-day-${state.day}.json`; a.click(); URL.revokeObjectURL(a.href)};
importFile.onchange=async e=>{const f=e.target.files[0]; if(!f)return; state=JSON.parse(await f.text()); await save(); render()}; resetBtn.onclick=async()=>{if(confirm('确定要重置世界？这会清除所有 IndexedDB 存档。')&&confirm('最后确认：所有本地进度都会消失。')){indexedDB.deleteDatabase(DB); state=initial(); await save(); render();}};
load().then(s=>{state=s;render()});
})();
</script>
</body>
</html>
